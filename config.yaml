# ============================================================
# 第4组 miniyu 配置
# 用户可直接用记事本修改此文件，无需改代码
# 优先级：环境变量 > 此文件 > 内置默认值
# ============================================================

llm:
  # 提供商：deterministic（离线脑，零依赖，默认）
  #          openai_compatible（兼容 OpenAI 格式的任意 API）
  provider: openai_compatible

  # 以下仅在 provider=openai_compatible 时需要配置
  # 常见 base_url：
  #   OpenAI:       https://api.openai.com/v1
  #   阿里云百炼:   https://dashscope.aliyuncs.com/compatible-mode/v1
  #   DeepSeek:     https://api.deepseek.com
  #   本地 Ollama:  http://localhost:11434/v1
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ""
  model: "qwen3.5-plus"

  # 模型是否支持视觉（看图）：看图/OCR 用谁只看这里——
  #   true：截图理解(screen_inspect)与 QQ 发送前 OCR 核对门都直接用主模型看图
  #         （如 qwen3.5-plus 原生多模态，截图内联给它）；
  #   false：主模型是纯文本（如部分 DeepSeek），截图/OCR 改走下方 vision_bridge 段
  #          配的独立视觉 API（可更便宜）。
  supports_vision: true

  # API 请求超时（秒）。超时后 miniyu 会提示检查网络或额度
  timeout: 60

  # 可选：本会话累计 token 上限（0 = 不限制）
  # 达到上限后 miniyu 会提示 token 已用尽，请重置对话
  max_total_tokens: 0

# ============================================================
# 视觉桥（vision_bridge）—— 给"看图/OCR"用的、独立于主对话的 API 配置
# ============================================================
# 看图/OCR 用谁，只由 llm.supports_vision 决定：
#   true  → 直接用主对话(llm)那个有视觉的模型读图（不必配这一段）；
#   false → 走这里的 vision_bridge 段（独立第二个视觉 API）。
# 用于：主对话是纯文本(llm.supports_vision=false)时，QQ 发送前的屏幕 OCR 核对门、
#       screen_inspect 的截图理解，都改走这里的有视觉模型。
# 可以和上面 llm 段互不影响地填不同 key / 不同厂商（例如主对话用纯文本的便宜 API，
# 这里单独填一个有视觉的便宜 API）。
# 注意：本机上面 supports_vision 已是 true → 此段当前是"备胎"，真正生效要等主对话
#       换成纯文本模型（supports_vision: false）。model 必须是【真正能读图】的视觉模型。
vision_bridge:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # 本机默认先和 llm 共用同一把 key（qwen3.5-plus 已验证能读图）；若你有单独的/更便宜的
  # 视觉 key，把这一行换成那一把即可（和主对话 llm 两把 key 互不影响）。
  api_key: ""
  model: "qwen3.5-plus"   # 换成有视觉的模型，如 qwen3.5-plus / qwen-vl-max 等
  timeout: 60

agent:
  # 单次任务最大步数（防死循环）
  max_steps: 15

  # 高危操作是否弹确认（kill_process 等）
  confirm_high_risk: true

  # 传给 LLM 的最近对话条数
  history_window: 20

  # 规划层开关（对标 AutoGPT 的任务分解）
  # 开启后复杂任务会先分解为子步骤再执行
  # 需要真实 LLM 支持，离线模式下自动禁用
  enable_planning: false

memory:
  # 会话存储目录（相对于项目根目录）
  # 对标 ChatGPT 的会话历史存储
  storage_dir: "conversations"

  # 自动摘要开关（需要真实 LLM 支持）
  # 对标 AutoGPT 的上下文压缩策略
  auto_summarize: false

  # 滑动窗口大小（与 agent.history_window 一致即可）
  window_size: 20

  # 记忆压缩触发阈值（0.0-1.0）
  # 当消息数达到窗口的 (1+threshold) 倍时触发压缩
  summarize_threshold: 0.8
