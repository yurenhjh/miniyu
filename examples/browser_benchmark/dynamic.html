<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Dynamic Benchmark 页</title>
<style>
  /* 本地受控动态页：纯离线、确定性 mock。验证 Anchor → Baseline → Action → Wait for Change → Delta → Targeted Read。
     不模拟聊天；DOM 结构稳定，仅结果区域文本随查询更新，便于语义增量检测。
     P2-7 A2 anchor 前置（A2 规划时落地的 fixture 改造，不改 Core / 不碰 browser_find scope）：
       - 整体以 <main> 包裹（语义主区域，anchor 发现入口）。
       - 结果区 #result_log 挂 class="results-thread" + min-height≥240 且可滚动：
         让 anchor 识别把它当作"可滚动的结果日志容器"(非纯列表)、非 composer，
         从而达成 reliable 判定；它仍是纯结果/日志语义，不含聊天文案。 */
  body{font-family:'Segoe UI',system-ui,sans-serif;max-width:680px;margin:2rem auto;padding:0 1rem;color:#222;line-height:1.7}
  h1{font-size:1.5rem;border-bottom:2px solid #eee;padding-bottom:.4rem}
  .card{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:1rem 1.2rem;margin:1rem 0}
  button{background:#2563eb;color:#fff;border:none;padding:.55rem 1rem;border-radius:6px;cursor:pointer;font-size:.95rem}
  button:disabled{background:#9ca3af;cursor:progress}
  input{font-size:.95rem;padding:.35rem .55rem;border:1px solid #ccc;border-radius:4px}
  .loading{color:#b45309}
  /* 结果日志容器：可滚动 + 足够高度 + 语义 class，供 anchor 识别（结果/日志语义，非聊天） */
  #result_log{min-height:260px;max-height:340px;overflow:auto;border-top:1px dashed #ccc;
              margin-top:.8rem;padding-top:.6rem;white-space:pre-line}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>本地动态 Benchmark 页面</h1>
  <p>输入城市名 → 点「查询」→ 约 1~2 秒加载后更新结果区域。专门验证 <code>wait for change / semantic delta / targeted read</code>，不含聊天语义。（mock 数据内联，无需外网。）</p>

  <div class="card">
    <h2>城市天气查询</h2>
    <label for="city_input">城市：</label>
    <input id="city_input" name="city_input" type="text" value="" placeholder="北京">
    <button id="btn_query" type="button">查询</button>

    <div id="status_loading" class="loading" hidden>加载中…</div>

    <div id="result_log" class="results-thread result-area" aria-live="polite" aria-label="查询结果">
      <span id="result_city">城市：—</span>
      <span id="result_weather">天气：—</span>
      <span id="result_tmp">温度：—</span>
    </div>
  </div>
</main>

<script>
  (function () {
    // 确定性 mock 数据（离线内置，不访问任何网络）
    var MOCK = {
      '北京': { weather: '晴', tmp: '26℃' },
      '上海': { weather: '多云', tmp: '24℃' },
      '广州': { weather: '阵雨', tmp: '28℃' }
    };
    var DEFAULT_ITEM = { weather: '未知', tmp: '—' };

    var input = document.getElementById('city_input');
    var btn = document.getElementById('btn_query');
    var loading = document.getElementById('status_loading');
    var rc = document.getElementById('result_city');
    var rw = document.getElementById('result_weather');
    var rt = document.getElementById('result_tmp');

    // 将结果区域重置为"查询前状态"（为 wait_for_change 提供明确的 baseline 变化）
    function resetResult() {
      rc.textContent = '城市：—';
      rw.textContent = '天气：—';
      rt.textContent = '温度：—';
    }

    btn.addEventListener('click', function () {
      btn.disabled = true;
      loading.hidden = false;
      resetResult();
      var city = (input.value || '').trim() || '北京';
      var delay = 1000 + Math.floor(Math.random() * 1000); // 1~2s 随机延迟，验证等变
      setTimeout(function () {
        var item = MOCK[city] || DEFAULT_ITEM;
        loading.hidden = true;
        btn.disabled = false;
        rc.textContent = '城市：' + city;
        rw.textContent = '天气：' + item.weather;
        rt.textContent = '温度：' + item.tmp;
      }, delay);
    });
  })();
</script>
</body>
</html>
